# Test / staging instance of Sylo-Fluxer, deployed to a remote Docker host (an
# Unraid box) over an SSH docker context — it runs 24/7 there, independent of
# any dev session. Deploy a new build with:
#
#   docker --context sylo-test compose -f docker-compose.test.yml --env-file .env.test up -d --build
#
# Notes:
#  - Named volume, not ./data: a bind-mount source path is resolved on the client
#    and would be meaningless on the remote daemon.
#  - The same host also runs the original (Discord) Sylo and Sylo-Test, so every
#    name here — service, container, image, volume — is prefixed sylo-fluxer and
#    the host port is 3011 (Sylo uses 3000, Sylo-Test 3010).
services:
  sylo-fluxer-test:
    build: .
    image: sylo-fluxer-test:latest
    container_name: sylo-fluxer-test
    restart: unless-stopped
    env_file: .env.test
    environment:
      # Pin the in-container port so it matches the mapping + healthcheck below,
      # regardless of what .env.test says.
      WEB_PORT: '3000'
    ports:
      - '3011:3000'
    volumes:
      - sylo-fluxer-test-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sylo-fluxer-test-data:
